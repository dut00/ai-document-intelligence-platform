# Serves the built UI and proxies the API on the same origin, as the Vite dev server does locally.

# The default format logs the query string, which on /hubs carries the access token.
log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log no_query;

    # The API caps uploads at 10 MB and answers larger ones itself; this only stops absurd bodies early.
    client_max_body_size 12m;

    # Docker's DNS, re-resolved so a restarted API container (new address) is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The client address is overwritten, never appended to: the API trusts only this proxy's value.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $api;
    }

    # SignalR over WebSockets.
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # A location's own proxy_set_header replaces the server-level ones, so repeat them.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        # The error log always writes the full request line, token included; an upstream failure
        # here also shows up on /api, which the browser calls first, so nothing is lost.
        error_log /var/log/nginx/error.log crit;
    }

    # Scalar UI and the OpenAPI document, so the API needs no published port.
    location ~ ^/(scalar|openapi)(/|$) {
        proxy_pass $api;
    }

    # Liveness only: the readiness report lists every dependency and its state.
    location = /health/live {
        proxy_pass $api;
    }

    # Hashed file names: a new build gets new URLs, so these can be cached for good.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all load index.html, which must never be cached, or a new build would not reach users.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
