# Local infrastructure. Copy .env.example to .env first.
#   docker compose up -d                        -> Postgres, RabbitMQ, SeaweedFS (S3), Aspire Dashboard
#   docker compose --profile full up --build    -> additionally api, worker and ui: the app at http://localhost:8080

name: document-intelligence

# Every published port is bound to 127.0.0.1: the credentials below are public development defaults,
# and the S3 master, RabbitMQ management and Aspire Dashboard have no authentication of their own.
# Publishing a port on all interfaces (e.g. to reach the app from another machine) needs real
# credentials in .env first. (The UI must be reached as http://localhost anyway: the refresh cookie
# is Secure, and browsers accept that over plain HTTP only on localhost.)

# Settings the API and the Worker share in the "full" profile; the rest comes from their appsettings.json.
x-app-environment: &app-environment
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  # The runtime image has no Kerberos library; without this Npgsql logs an error probing for it.
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  Storage__ServiceUrl: http://seaweedfs:8333
  Storage__AccessKey: ${S3_ACCESS_KEY}
  Storage__SecretKey: ${S3_SECRET_KEY}
  Storage__BucketName: ${S3_BUCKET}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # S3-compatible object storage for uploaded files.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333" # S3 API
      - "127.0.0.1:9333:9333" # master UI
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer (403 for an anonymous request) means the S3 gateway is serving.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Receives OTLP traces, metrics and logs; UI at http://localhost:18888
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:18888:18888" # dashboard UI
      - "127.0.0.1:4317:18889"  # OTLP gRPC

  # Profile "full": the application itself, built from source.

  # No published port: only nginx (ui) reaches it, which is what makes trusting the Docker networks'
  # address ranges for X-Forwarded-For safe. Scalar is at http://localhost:8080/scalar.
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: src/DocumentIntelligence.Api/Dockerfile
    environment:
      <<: *app-environment
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Database__MigrateOnStartup: "true"
      OpenApi__Enabled: "true"
      # Docker's default address pools; the client address then comes from nginx.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__1: 192.168.0.0/16
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # New documents, deletions and faults. A document whose delivery was interrupted (the Worker died
  # while holding it) is handed on to worker-isolated rather than processed here again.
  worker:
    profiles: [full]
    build:
      context: .
      dockerfile: src/DocumentIntelligence.Worker/Dockerfile
    # A hostile PDF can make the parser allocate heavily or spin: the container, not the host, runs out
    # of memory or CPU.
    mem_limit: 1g
    cpus: 2
    environment:
      <<: *app-environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Worker__Role: Main
    # Time to finish the documents in hand (up to 5 minutes each, see WorkerConsumers) before Docker kills
    # the process: a message returned unfinished counts as an interrupted delivery.
    stop_grace_period: 8m
    depends_on:
      # The API applies the migrations; it reports healthy only once they are done.
      api:
        condition: service_healthy
    restart: unless-stopped

  # Redelivered documents, one at a time, in a process of their own: a crash here can only be the doing
  # of the document being processed, which is failed after 3 such crashes (IsolatedDocumentConsumer).
  worker-isolated:
    profiles: [full]
    build:
      context: .
      dockerfile: src/DocumentIntelligence.Worker/Dockerfile
    mem_limit: 1g
    cpus: 1
    environment:
      <<: *app-environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Worker__Role: Isolated
    stop_grace_period: 8m
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # nginx: serves the UI build and proxies /api, /hubs and /scalar to the API.
  ui:
    profiles: [full]
    build: frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
