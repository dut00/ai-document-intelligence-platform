# Weekly dependency updates, one grouped pull request per ecosystem; CI checks every pull request.
# Security updates (a pull request as soon as an advisory is published) additionally need
# "Dependabot security updates" switched on in the repository's Settings > Code security.
version: 2

updates:
  # Versions live in Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Base images stay on their major lines (.NET 10, Node 24, nginx 1.x); major upgrades are deliberate.
  - package-ecosystem: docker
    directories:
      - /src/DocumentIntelligence.Api
      - /src/DocumentIntelligence.Worker
      - /frontend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # postgres, rabbitmq, seaweedfs and the Aspire Dashboard, same rule as above.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
